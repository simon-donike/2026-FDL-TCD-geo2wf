name: Scientific checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run python -m pytest -q
        env:
          OMP_NUM_THREADS: '2'
      - name: Check data-free reproduction tables
        run: uv run geo2wf-evaluate conference tables
